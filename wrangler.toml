name = "dashboard-unsa"
type = "javascript"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Base de datos D1 (reemplaza public/data/initialData.json estático)
[[d1_databases]]
binding = "DB"
database_name = "academic-db"
database_id = "tu-database-id-aqui"  # Actualizar después de crear la BD en Cloudflare

# Variables de entorno (si las necesitas en los workers)
[env.production]
d1_databases = [
  { binding = "DB", database_name = "academic-db", database_id = "tu-database-id-aqui" }
]

[env.development]
d1_databases = [
  { binding = "DB", database_name = "academic-db-dev", database_id = "tu-dev-database-id-aqui" }
]
